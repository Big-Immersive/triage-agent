[project]
name = "triage"
version = "0.1.0"
description = "Multi-agent bug-report triage: raw feedback in, de-duplicated engineering tickets out. Built on LlamaIndex AgentWorkflow."
requires-python = ">=3.12,<3.13"
dependencies = [
    "llama-index-core>=0.14",
    "llama-index-workflows>=2.20,<2.24",  # 2.24.0 (2026-09-16) breaks FunctionAgent.run(): unhashable pydantic workflow
    "llama-index-llms-ollama",
    "llama-index-llms-openrouter",
    "llama-index-embeddings-ollama",
    "llama-index-embeddings-openai",
    "pydantic>=2",
    "rich",
    "python-dotenv",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23",
    "pyjwt>=2.8",
    "cryptography>=42",
    "websockets>=12",
    "httpx>=0.27",
    "pypdf>=4",
    "email-validator>=2",
    "boto3>=1.34",
    "llama-index-vector-stores-postgres",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
triage = "triage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["triage", "api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
